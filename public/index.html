<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tunes</title>
  <meta name="description" content="Lični muzički player: tvoja biblioteka, internet radio, Audius i Internet Archive na jednom mestu.">
  <meta name="theme-color" content="#000000">
  <script>
    // Tema se postavlja pre crtanja stranice, da ne bi bljesnula pogrešna boja.
    (function () {
      var t = 'crna';
      try { t = JSON.parse(localStorage.getItem('sl.theme')) || 'crna'; } catch (e) {}
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name=theme-color]').content = t === 'crna' ? '#000000' : '#1c1f3a';
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">
  <link rel="stylesheet" href="/fonts/standard.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Preskoči na sadržaj</a>
  <div class="app" id="app">
    <div class="topbar">
      <button class="ibtn" type="button" id="navToggle" aria-label="Meni" aria-expanded="false" aria-controls="side"></button>
      <span class="brand brand--small">Tunes</span>
      <a class="ibtn" href="#/pretraga" id="topSearch" aria-label="Pretraga"></a>
    </div>

    <nav class="side" id="side" aria-label="Glavni meni"></nav>

    <main class="main" id="main" tabindex="-1"></main>

    <aside class="panel" id="panel" aria-label="Bočni panel" hidden></aside>

    <footer class="deck" id="deck" aria-label="Player"></footer>
  </div>

  <div class="now" id="now" role="dialog" aria-modal="true" aria-label="Sada svira" hidden></div>
  <div class="eq" id="eq" role="dialog" aria-label="Ekvalizer" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
